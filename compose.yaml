services:
  postgres:
    build:
      context: .
      dockerfile: db/postgres.Dockerfile
    environment:
      POSTGRES_USER: plantillas
      POSTGRES_DB: plantillas
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "plantillas", "-d", "plantillas"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [datos]
  migrate:
    build:
      context: .
      dockerfile: db/migrate.Dockerfile
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${DATABASE_URL:-postgres://plantillas@postgres:5432/plantillas?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [datos]
  backend:
    build: ./apps/api
    environment:
      API_ENV: ${API_ENV:-dev}
      APP_VERSION: ${APP_VERSION:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgres://plantillas@postgres:5432/plantillas?sslmode=disable}
      DATABASE_TIMEOUT: ${DATABASE_TIMEOUT:-5s}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://host.docker.internal:5102/.well-known/jwks.json}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:5102}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-plantillas-reporte}
      AUTH_ROLE_CLAIM: ${AUTH_ROLE_CLAIM:-perfil}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "127.0.0.1:${API_PORT:-5100}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [datos, web]
  frontend:
    build: ./apps/web
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5101}:80"
    depends_on: [backend]
    networks: [web]
networks:
  datos:
    internal: true
  web:
volumes:
  postgres-data:
