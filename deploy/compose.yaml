services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["mongosh", "mongodb://mongo:27017", "--quiet", "--eval", "try { rs.status().ok } catch (_) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); } "]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/?replicaSet=rs0}
      MONGO_DATABASE: ${MONGO_DATABASE:-plantillas_reportes}
      MONGO_TIMEOUT: ${MONGO_TIMEOUT:-10s}
      AUTH_IDENTITIES_JSON: ${AUTH_IDENTITIES_JSON:?Define AUTH_IDENTITIES_JSON en deploy/.env}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - api

volumes:
  mongo-data:
